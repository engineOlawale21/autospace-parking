syntax = "proto3";

package autospace.common.v1;

option go_package = "github.com/autospace/contracts/gen/go/autospace/common/v1;commonv1";

message Money {
  int64 minor_units = 1;
  string currency = 2;
}

message TimeRange {
  int64 starts_at_unix_ms = 1;
  int64 ends_at_unix_ms = 2;
  string timezone = 3;
}

message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
}
